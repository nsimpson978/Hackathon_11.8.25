plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

javafx {
    version = "22"
    modules = [ "javafx.controls", "javafx.fxml" ]
}

application {
    mainClass = "Main"
}

sourceSets {
    main {
        java {
            srcDirs = ["src"]
        }
        resources {
            srcDirs = ["resources"]
            includes = ["**/*.fxml", "**/*.jpg", "**/*.png"]
        }
    }
}

dependencies {
    implementation 'org.json:json:20210307'
}
